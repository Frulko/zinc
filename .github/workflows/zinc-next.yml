# Zinc Next, by branch (owner, 2026-10-19): the work happens on develop and its pushes run nothing. A release (`make release`, from develop) fast-forwards main to
# develop and pushes a `v*` tag: that tag is the one pipeline of a release (owner, 2026-10-20): the whole tier T2, the packages, the release, then the plugin
# mirrors and the site. Pushes to main and develop run nothing; a manual run (workflow_dispatch) does the whole tier without releasing.
# macOS first (owner, 2026-10-15): the Linux jobs are out of the matrix; Windows has its own package job (package-windows, experimental: a zip and install.ps1);
# windows-cross and windows-console (the cross build from Linux) stay below, switched off.
# A `v*` tag also makes a release (ZN-329): each OS job signs its package when the signing secrets exist and writes a signed update manifest,
# then the release job attaches everything to a GitHub Release. The secrets and the tag command: docs/guide/07-distribution.md, "Releases".
name: zinc-next
on:
  push:
    tags: ['v*']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.event_name || 'code' }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}   # a release is never cancelled; a newer manual run replaces the older one
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      test: ${{ steps.scope.outputs.test }}
      full: ${{ steps.scope.outputs.full }}
      bench: ${{ steps.scope.outputs.bench }}
      reproducible: ${{ steps.scope.outputs.reproducible }}
      package: ${{ steps.scope.outputs.package }}
      base: ${{ steps.scope.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: scope
        name: Select checks
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          full=
          if [[ "$EVENT" == schedule || "$EVENT" == workflow_dispatch || "$GITHUB_REF" == refs/tags/v* ]]; then full=--full; fi
          base="$BEFORE"
          if [ "$EVENT" = pull_request ]; then base="$PR_BASE"; fi
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base=$(git merge-base "origin/$DEFAULT_BRANCH" HEAD 2>/dev/null) || base=$(git hash-object -w -t tree /dev/null)
          fi
          git diff --name-only "$base" HEAD -- > "$RUNNER_TEMP/changed-paths"
          python3 tools/ci-plan ${full:+"$full"} < "$RUNNER_TEMP/changed-paths" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
  build:
    # The arm64 build, once: the tests and the arm64 package download it instead of compiling again (the Intel package builds its own, in parallel). ccache keeps
    # the objects between runs, so a run that changed a few files recompiles those.
    name: build-macos-arm64
    needs: plan
    if: needs.plan.outputs.package == 'true' || needs.plan.outputs.test == 'true' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies (macOS)
        run: brew install cmake sdl3 coreutils quickjs pixman libgcrypt sdl2 ccache
      - name: ccache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-arm64-${{ github.sha }}
          restore-keys: ccache-arm64-
      - name: Build
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache
          CCACHE_MAXSIZE: 600M
        run: |   # the version zinc reports: the tag's (v1.2.0 -> 1.2.0), else git describe (0.0.0-dev in a shallow clone); the update key is update.pub
          ver=(); if [ "$GITHUB_REF_TYPE" = tag ]; then ver=(-DZN_VERSION="${GITHUB_REF_NAME#v}"); fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3 -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache "${ver[@]}" && cmake --build build -j4
      - name: Keep the build tree, objects included (12 tests run cmake --build on it)
        run: tar czf build.tgz build
      - uses: actions/upload-artifact@v4
        with:
          name: build-macos-arm64
          path: build.tgz
          compression-level: 0
          retention-days: 3
  package:
    # The binary first: build, package the two downloads (the zinc CLI tar.gz and the Zinc Atelier app zip), one smoke test of both (installed with no compiler
    # on the PATH, Atelier checked and opened headless), sign, upload. A release needs this job only.
    name: package-${{ matrix.name }}
    needs: [plan, build]
    if: needs.plan.outputs.package == 'true' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, name: macos-arm64 }
          - { os: macos-15-intel, name: macos-x86_64, experimental: true }   # ZN-718: the Intel Macs of schools; its failure does not stop the release
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        if: matrix.name == 'macos-arm64'
        with:
          name: build-macos-arm64
          path: .
      - name: Unpack the build
        if: matrix.name == 'macos-arm64'
        run: tar xzf build.tgz && rm build.tgz && ls build/zinc
      - name: Dependencies (macOS)
        run: brew install cmake sdl3 coreutils quickjs pixman libgcrypt sdl2 ccache
      - name: ccache
        if: matrix.name != 'macos-arm64'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-x86_64-${{ github.sha }}
          restore-keys: ccache-x86_64-
      - name: Build, Intel only (the shared build is arm64)
        if: matrix.name != 'macos-arm64'
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache
          CCACHE_MAXSIZE: 600M
        run: |   # the version zinc reports: the tag's (v1.2.0 -> 1.2.0), else git describe (0.0.0-dev in a shallow clone); the update key is update.pub
          ver=(); if [ "$GITHUB_REF_TYPE" = tag ]; then ver=(-DZN_VERSION="${GITHUB_REF_NAME#v}"); fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3 -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache "${ver[@]}" && cmake --build build -j4
      - name: Cache pinned toolchains
        uses: actions/cache@v4
        with:
          path: ~/.zinc/toolchains
          key: toolchains-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/tc/tc.cpp', 'src/tc/tc.h') }}
      - name: Package
        # ZN-718: the engine and, built here with the pinned zig, the native library of every plugin that needs no system library (the log names the others)
        run: |
          python3 tools/package --out dist   # named after the version the binary reports (the tag's on a release)
          ls dist/zinc-*-macos-*.tar.gz dist/Zinc-Atelier-*-macos-*.zip
      - name: Smoke test of the CLI archive and the app
        run: ZINC_DIST="$PWD/dist" tests/run --only install_nocompiler
      - name: Sign and notarize (macOS release)
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          ZINC_SIGN_IDENTITY: ${{ secrets.ZINC_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE_P12" ] || [ -z "$ZINC_SIGN_IDENTITY" ] || [ -z "$APPLE_ID" ]; then
            echo "::warning::no signing secrets: the macOS downloads are released unsigned and not notarized"
            exit 0
          fi
          kc="$RUNNER_TEMP/zinc.keychain-db"; pw=$(openssl rand -hex 16)
          security create-keychain -p "$pw" "$kc" && security set-keychain-settings -lut 3600 "$kc" && security unlock-keychain -p "$pw" "$kc"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign && rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" login.keychain-db
          xcrun notarytool store-credentials zinc-notary --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --keychain "$kc"
          # the app (stapled) and the CLI (its Mach-O files signed, notarized, no staple: docs/guide/07-distribution.md)
          for z in dist/Zinc-Atelier-*-macos-*.zip; do
            ZINC_NOTARY_PROFILE=zinc-notary tools/sign-macos "$z" && mv "${z%.zip}-notarized.zip" "$z"
          done
          for t in dist/zinc-*-macos-*.tar.gz; do
            ZINC_NOTARY_PROFILE=zinc-notary tools/sign-macos "$t" && mv "${t%.tar.gz}-notarized.tar.gz" "$t"
          done
          echo signed > dist/.signed
      - name: Update manifests (release)
        # what zinc update reads: zinc-<os>-<arch>.manifest (stable) and zinc-<os>-<arch>-beta.manifest, signed with ZINC_UPDATE_SEED (its public key is
        # update.pub); without the secret they are written unsigned (signature=none), which zinc update refuses unless ZINC_UPDATE_ALLOW_UNSIGNED=1.
        # A prerelease tag (v1.3.0-beta.1) writes the beta one only, with the archive's whole address: the release job puts it on the latest release.
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ZINC_UPDATE_SEED: ${{ secrets.ZINC_UPDATE_SEED }}
        run: |
          for pkg in dist/zinc-*.tar.gz dist/zinc-*.zip; do [ -f "$pkg" ] && break; done
          [ -f "$pkg" ] || { echo "::error::no CLI archive in dist"; exit 1; }
          v=${GITHUB_REF_NAME#v} file=$(basename "$pkg") sum=$(shasum -a 256 "$pkg" | cut -d' ' -f1)
          manifest() {   # manifest <channel> <url> <out>
            printf 'channel=%s\nversion=%s\nurl=%s\nsha256=%s\nnotes=%s\n' "$1" "$v" "$2" "$sum" "Zinc $GITHUB_REF_NAME" > "$RUNNER_TEMP/m"
            if [ -n "$ZINC_UPDATE_SEED" ]; then build/zinc update-sign "$RUNNER_TEMP/m" "$ZINC_UPDATE_SEED" > "$3"
            else { echo "signature=none"; cat "$RUNNER_TEMP/m"; } > "$3"; fi
          }
          [ -n "$ZINC_UPDATE_SEED" ] || echo "::warning::no ZINC_UPDATE_SEED: the update manifests of ${{ matrix.name }} are unsigned (signature=none)"
          case "$v" in
            *-*) manifest beta "${GITHUB_SERVER_URL:-https://github.com}/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$file" "dist/zinc-${{ matrix.name }}-beta.manifest" ;;
            *) manifest stable "$file" "dist/zinc-${{ matrix.name }}.manifest"; manifest beta "$file" "dist/zinc-${{ matrix.name }}-beta.manifest" ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.name }}
          path: dist/
          include-hidden-files: true   # dist/.signed: the macOS package was signed and notarized
  test:
    # The whole tier, split in parallel shards (tests/run --shard i/n). A FAIL never blocks the release: each shard uploads its results and logs, and `report` gathers them.
    needs: [plan, build]
    if: needs.plan.outputs.test == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    name: tests ${{ matrix.shard }}/6
    runs-on: macos-15
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }   # the tests' helper servers (http.server, ssl, sockets) were written for 3.9 to 3.12; Homebrew's python 3.14 is on the runner's PATH first
      - uses: pnpm/action-setup@v4
        with: { version: '10' }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: 'pnpm' }
      - name: Install compiler dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: build-${{ 'macos-arm64' }}
          path: .
      - name: Unpack the build
        run: tar xzf build.tgz && rm build.tgz && ls build/zinc
      - name: Dependencies (macOS)
        run: |   # ccache: the build tree names it as its compiler launcher, tests that run cmake --build on it need it; PyYAML and actionlint: release_workflow checks this file
          brew install cmake sdl3 coreutils quickjs pixman libgcrypt sdl2 ccache actionlint
          python -m pip install --quiet pyyaml
      - name: Cache pinned toolchains
        uses: actions/cache@v4
        with:
          path: |
            ~/.zinc/toolchains
            ${{ runner.temp }}/zinc-home/toolchains
          key: toolchains-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/tc/tc.cpp', 'src/tc/tc.h') }}
      - name: Test libraries
        # third-party files some tests load and the repository does not carry (LGPL, licences): taken once from their official release, checked against a pinned SHA-256
        run: tools/test-lib p5-1.11.13 >/dev/null && tools/test-lib gsap-3.15.0 >/dev/null
      - name: Quiet the runner
        # Spotlight indexes the fresh checkout and the build tree on a 3-core runner: the tests run under it
        run: sudo mdutil -a -i off >/dev/null 2>&1 || true
      - name: Restore the plugin and asset cache
        id: zcache
        uses: actions/cache/restore@v4
        with:
          path: ~/.zinc/cache
          key: zinc-cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('plugins/**', 'examples/marble/**', 'templates/3d/**', 'src/tc/**', 'src/assets/**', 'include/zn/**', 'src/native/**', 'runtime/**') }}
      - name: Warm the cache
        # on an empty cache, webrtc's native libraries and marble's assets and plugins are built inside a test's timeout and the test times out
        # (docs/reports/ci-runner-failures-2026-10-18.md): built once here, before the clock of any test starts
        if: steps.zcache.outputs.cache-hit != 'true'
        run: |
          build/zinc plugin-build webrtc examples/webrtc-call >/dev/null
          build/zinc plugin-build webrtc examples/webrtc-chat >/dev/null
          build/zinc assets build examples/marble >/dev/null
          ZINC_HEADLESS=1 ZINC_FRAMES=3 build/zinc run examples/marble >/dev/null   # its native plugins (zinc:audio, zinc:3d) too
          build/zinc new 3d "$RUNNER_TEMP/warm-3d" >/dev/null   # the 3d template's plugin (three): first_run gives each template 20 s
          (cd "$RUNNER_TEMP/warm-3d" && ZINC_HEADLESS=1 ZINC_FRAMES=3 "$GITHUB_WORKSPACE/build/zinc" run >/dev/null)
      - name: Save the plugin and asset cache
        if: steps.zcache.outputs.cache-hit != 'true'
        continue-on-error: true   # six shards save the same key: the first one wins
        uses: actions/cache/save@v4
        with:
          path: ~/.zinc/cache
          key: ${{ steps.zcache.outputs.cache-primary-key }}
      - name: Tests
        env:
          ZINC_TEST_HOME: ${{ runner.temp }}/zinc-home
          ZINC_CI: '1'   # a hosted runner: a virtual GPU and no debugger rights, the tests that need them skip
          ZINC_TEST_RESULTS: ${{ runner.temp }}/results-${{ matrix.shard }}.txt
          FULL: ${{ needs.plan.outputs.full }}
          BASE: ${{ needs.plan.outputs.base }}
        run: |
          if [ "$FULL" = true ]; then
            tests/run --tier t2 --shard ${{ matrix.shard }}/6
          else
            tests/run --changed-from "$BASE" --tier t1 --shard ${{ matrix.shard }}/6
          fi
      - name: Snapshot of the runner
        # what the runner is, for the failures that pass on a developer's Mac: system, loopback, firewall, limits, display, free ports, running processes
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          {
            echo "## system"; sw_vers; uname -a; sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize; xcodebuild -version 2>&1 | head -2; clang --version | head -1
            echo "## load"; uptime; vm_stat | head -4; echo "## busiest processes"; ps -Ao pid,pcpu,etime,comm -r | head -12
            echo "## limits"; ulimit -a
            echo "## loopback"; ifconfig lo0 | head -6; netstat -an -p tcp | grep -c LISTEN; python3 -c "import socket;s=socket.socket();s.bind(('127.0.0.1',0));print('can bind 127.0.0.1:',s.getsockname()[1])"
            echo "## firewall"; /usr/libexec/ApplicationFirewall/socketfilterfw --getglobalstate 2>&1 | head -2
            echo "## display"; system_profiler SPDisplaysDataType 2>&1 | head -12
            echo "## python"; python3 --version; which python3
            echo "## a local http server (what several tests start): where does python wait?"
            python3 -c "import faulthandler,socket,time; faulthandler.dump_traceback_later(8,exit=True); t=time.time(); print('getfqdn', socket.getfqdn('127.0.0.1'), round(time.time()-t,2)); t=time.time(); socket.getaddrinfo('127.0.0.1',0,type=socket.SOCK_STREAM,flags=socket.AI_PASSIVE); print('getaddrinfo', round(time.time()-t,2)); import http.server; t=time.time(); s=http.server.ThreadingHTTPServer(('127.0.0.1',0),http.server.SimpleHTTPRequestHandler); print('bound', s.server_address, round(time.time()-t,2))" 2>&1 | head -30
            echo "## disk"; df -h . | tail -1
          } > "$RUNNER_TEMP/out/env-${{ matrix.shard }}.txt" 2>&1 || true
      - name: Rerun the failures with a trace
        # the quiet runner keeps only a test's own messages: a failure that passes on a developer's Mac needs the shell trace of the same run on the runner
        if: always()
        env:
          ZINC_TEST_HOME: ${{ runner.temp }}/zinc-home
          ZINC_CI: '1'
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          export ZINC="$PWD/build/zinc" ZINC_DETERMINISTIC=1 ZINC_STEPS=0 ZN_WAIT_SCALE=4 PYTHONPATH="$PWD/tests/ci"   # as tests/run sets them on CI
          for name in $(grep '^FAIL' "$RUNNER_TEMP/results-${{ matrix.shard }}.txt" 2>/dev/null | awk '{print $2}' | head -8); do
            for f in tests/t*/"$name".sh; do   # a name may exist in two tiers (package): the trace of each
              [ -e "$f" ] || continue
              timeout 300 sh -x "$f" > "$RUNNER_TEMP/out/trace-$name-$(basename "$(dirname "$f")").log" 2>&1 || true
            done
          done
      - name: Keep results and logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp "$RUNNER_TEMP/results-${{ matrix.shard }}.txt" "$RUNNER_TEMP/out/" 2>/dev/null || true
          cp -R .logs "$RUNNER_TEMP/out/logs-${{ matrix.shard }}" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.shard }}
          path: ${{ runner.temp }}/out/
  fuzz:
    # Fuzzing (60 s per target with ASan and UBSan) is a milestone check: the nightly and manual runs, not every push. Apple's clang (see its Dependencies step).
    name: fuzz
    needs: [plan, build]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/download-artifact@v4
        with:
          name: build-macos-arm64
          path: .
      - name: Unpack the build
        run: tar xzf build.tgz && rm build.tgz && ls build/zinc
      - name: Dependencies (macOS)
        # Apple's clang and the libFuzzer tools/libfuzzer builds from the pinned compiler-rt (ZN-433), not Homebrew's LLVM: Xcode's ld refuses the
        # archives Homebrew's clang writes on this runner ("invalid r_symbolnum", LLVM 19 and 23 alike) and LLVM's lld links a fuzzer whose exceptions are
        # never caught. Apple's libc++ marks the unused capacity of a vector as poisoned: ASan's container-overflow check is off (ASAN_OPTIONS below)
        run: brew install cmake sdl3 coreutils quickjs pixman libgcrypt sdl2 ccache
      - name: Fuzz
        env:
          ZINC_CI: '1'
          ZINC_FUZZ: '1'
        run: LLVM=none ASAN_OPTIONS=detect_container_overflow=0 tests/run --tier t2 --only fuzz   # LLVM=none: tools/fuzz takes Apple's clang
      - name: Keep the crashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: |
            tests/fuzz/crashes/
            build-fuzz/log-*.txt
          if-no-files-found: ignore
  report:
    # One artifact with every test's result and the logs of the failures, plus the list in the run's summary.
    needs: [plan, test, release]
    if: always() && needs.test.result != 'skipped'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: test-results-*
          path: parts
          merge-multiple: true
      - name: Build the report
        run: |
          mkdir -p report
          cat parts/results-*.txt 2>/dev/null | sort -k2 > report/results.txt || true
          p=$(grep -c '^PASS' report/results.txt || true); f=$(grep -c '^FAIL' report/results.txt || true); k=$(grep -c '^SKIP' report/results.txt || true)
          {
            echo "# Zinc tests: $p passed, $f failed, $k skipped"
            echo
            if [ "$f" != 0 ]; then echo "## Failed"; grep '^FAIL' report/results.txt | awk '{print "- " $2 " (" $3 ")"}'; fi
            echo
            echo "Logs of the failures: artifact \`test-report\` (logs-*/*.log)."
          } > report/REPORT.md
          cp -R parts/logs-* report/ 2>/dev/null || true
          cp parts/trace-*.log parts/env-*.txt report/ 2>/dev/null || true   # the shell trace of each failure rerun on the runner, and a snapshot of the runner
          cat report/REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: report/
      - name: Attach the report to the release
        if: startsWith(github.ref, 'refs/tags/v') && needs.release.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: (cd report && zip -qr ../test-report.zip .) && gh release upload "$GITHUB_REF_NAME" test-report.zip --clobber
  package-windows:
    # zinc.exe built natively on a Windows runner with the pinned zig (no Visual Studio: cmake/zig-windows.cmake, docs/targets/windows.md), with the graphics
    # host, packaged as zinc-<version>-windows-x86_64.zip by tools/package, smoke tested unpacked (CLI, doctor, a program, hero headless), and, on a v* tag,
    # given its update manifest. The runner has no GPU: the renderer under test is the CPU one. Experimental like the Intel Mac: its failure does not stop a release.
    name: package-windows-x86_64
    needs: plan
    if: needs.plan.outputs.package == 'true' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Cache pinned toolchains and zig's compile cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.zinc/toolchains
            ~/AppData/Local/zig
          key: windows-zig-${{ hashFiles('src/tc/tc.cpp', 'tools/windows-setup.ps1') }}-${{ github.sha }}
          restore-keys: windows-zig-${{ hashFiles('src/tc/tc.cpp', 'tools/windows-setup.ps1') }}-
      - name: Tools and the pinned zig
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tools\windows-setup.ps1 -NoBuild
      - name: Build zinc.exe
        run: |   # the version zinc reports: the tag's (v1.2.0 -> 1.2.0), else git describe; the update key is update.pub
          ver=(); if [ "$GITHUB_REF_TYPE" = tag ]; then ver=(-DZN_VERSION="${GITHUB_REF_NAME#v}"); fi
          for zig in "$USERPROFILE"/.zinc/toolchains/zig-*-windows-*/zig.exe; do break; done
          cmake -S . -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE="$PWD/cmake/zig-windows.cmake" -DZIG="$zig" -DCMAKE_BUILD_TYPE=Release -DZN_HOST_GFX=ON "${ver[@]}"
          cmake --build build --target zinc zinc-atelier
      - name: Package
        run: |
          python tools/package --out dist   # the version the binary reports
          for f in dist/zinc-*-windows-*.zip dist/Zinc-Atelier-*-windows-*.zip; do [ -f "$f" ] || { echo "::error::no $f"; exit 1; }; echo "$f"; done
      - name: Smoke test of the archive, unpacked, no compiler on the PATH
        run: |
          mkdir smoke && cd smoke && python -m zipfile -e ../dist/zinc-*-windows-*.zip . && cd zinc-*
          unset ZINC_ROOT; export ZINC_HOME="$RUNNER_TEMP/zinc-home" ZINC_BACKGROUND=1 ZINC_HEADLESS=1
          ./bin/zinc.exe --version
          root=$(./bin/zinc.exe --root | tr -d '\r')   # the package around zinc.exe, not the checkout's path compiled in (on a user's machine that path does not exist)
          case "$root" in *smoke*) ;; *) echo "::error::zinc.exe does not find the package around it: its root is $root"; exit 1 ;; esac
          ./bin/zinc.exe doctor
          printf 'console.log(6 * 7);\n' > "$RUNNER_TEMP/answer.ts"
          [ "$(./bin/zinc.exe run "$RUNNER_TEMP/answer.ts" | tr -d '\r' | tail -1)" = 42 ]
          ZINC_FRAMES=20 ./bin/zinc.exe run "$GITHUB_WORKSPACE/examples/hero"
          ZINC_FRAMES=20 ZINC_RENDERER=cpu ZINC_HEADLESS='' ./bin/zinc.exe run "$GITHUB_WORKSPACE/examples/hero" || echo "::warning::no window on this runner: the CPU window run failed"
      - name: Smoke test of the app, unpacked
        # Zinc Atelier.exe starts zinc.exe on the Atelier (headless here, its environment is inherited) and writes the first project's hello.ts
        run: |
          mkdir smoke-app && cd smoke-app && python -m zipfile -e ../dist/Zinc-Atelier-*-windows-*.zip . && cd "Zinc Atelier"
          ZINC_PROJECT=$(cygpath -w "$RUNNER_TEMP/atelier-project")
          export ZINC_HOME="$RUNNER_TEMP/zinc-home-app" ZINC_BACKGROUND=1 ZINC_HEADLESS=1 ZINC_FRAMES=30 ZINC_PROJECT
          ./bin/zinc.exe run share/zinc/app/atelier/main.tsx -- "$RUNNER_TEMP/atelier-direct"   # the Atelier itself runs from the download
          ./"Zinc Atelier.exe"
          for _ in $(seq 60); do [ -f "$RUNNER_TEMP/atelier-project/hello.ts" ] && break; sleep 1; done
          [ -f "$RUNNER_TEMP/atelier-project/hello.ts" ] || { echo "::error::Zinc Atelier.exe did not start the Atelier"; exit 1; }
      - name: Test the installer against the archive
        shell: pwsh
        run: |
          $rel = Join-Path $env:RUNNER_TEMP 'rel'; New-Item -ItemType Directory $rel | Out-Null
          $zip = Get-ChildItem dist\zinc-*-windows-*.zip | Select-Object -First 1; Copy-Item $zip $rel
          "$((Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower())  $($zip.Name)" | Set-Content (Join-Path $rel SHA256SUMS)
          $env:ZINC_INSTALL_URL = "file:///$($rel -replace '\\','/')"; $env:ZINC_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'installed'; $env:ZINC_NO_MODIFY_PATH = '1'
          powershell -ExecutionPolicy Bypass -File tools\install.ps1
          & (Join-Path $env:ZINC_INSTALL_DIR 'bin\zinc.exe') --version
      - name: Update manifest (release)
        # zinc-windows-x86_64.manifest (stable) and zinc-windows-x86_64-beta.manifest, as the macOS jobs write them (the same signature, ZINC_UPDATE_SEED)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ZINC_UPDATE_SEED: ${{ secrets.ZINC_UPDATE_SEED }}
        run: |
          for pkg in dist/zinc-*-windows-*.zip; do break; done
          v=${GITHUB_REF_NAME#v} file=$(basename "$pkg") sum=$(sha256sum "$pkg" | cut -d' ' -f1)
          manifest() {   # manifest <channel> <url> <out>
            printf 'channel=%s\nversion=%s\nurl=%s\nsha256=%s\nnotes=%s\n' "$1" "$v" "$2" "$sum" "Zinc $GITHUB_REF_NAME" > "$RUNNER_TEMP/m"
            if [ -n "$ZINC_UPDATE_SEED" ]; then build/zinc.exe update-sign "$RUNNER_TEMP/m" "$ZINC_UPDATE_SEED" > "$3"
            else { echo "signature=none"; cat "$RUNNER_TEMP/m"; } > "$3"; fi
          }
          [ -n "$ZINC_UPDATE_SEED" ] || echo "::warning::no ZINC_UPDATE_SEED: the update manifests of windows-x86_64 are unsigned (signature=none)"
          case "$v" in
            *-*) manifest beta "${GITHUB_SERVER_URL:-https://github.com}/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$file" "dist/zinc-windows-x86_64-beta.manifest" ;;
            *) manifest stable "$file" "dist/zinc-windows-x86_64.manifest"; manifest beta "$file" "dist/zinc-windows-x86_64-beta.manifest" ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: package-windows-x86_64
          path: dist/
  windows-cross:
    # ZN-714: zinc does not build on Windows yet, its programs do: the console programs of tests/golden/run are cross-built here (zinc build --target x86_64-windows,
    # the pinned zig) and handed to windows-console with their frozen outputs. Never run yet, so it does not block.
    name: windows-cross
    needs: plan
    if: vars.ZINC_WINDOWS_JOBS == 'true'   # off unless that repository variable is set: macOS only (owner, 2026-10-15)
    runs-on: ubuntu-24.04
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake python3 curl xz-utils libx11-dev libxext-dev libxcursor-dev libxi-dev libxfixes-dev libxrandr-dev libxss-dev libxtst-dev libgl1-mesa-dev
      - name: Build zinc
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3 && cmake --build build --target zinc -j4
      - name: Cross build the console programs
        env:
          ZINC_HOME: ${{ runner.temp }}/zinc-home
        run: tools/windows-cross build "$RUNNER_TEMP/windows-console"
      - name: Cross build zinc.exe, headless (docs/reports/zinc-windows-port.md)
        env:
          ZINC_HOME: ${{ runner.temp }}/zinc-home
        run: |
          cmake -S . -B build-win -DCMAKE_TOOLCHAIN_FILE=cmake/zig-windows.cmake -DZN_HOST_GFX=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build-win --target zinc platform_test -j4
          mkdir -p "$RUNNER_TEMP/windows-zinc" && cp build-win/zinc.exe build-win/platform_test.exe "$RUNNER_TEMP/windows-zinc/"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-console
          path: ${{ runner.temp }}/windows-console/
      - uses: actions/upload-artifact@v4
        with:
          name: windows-zinc
          path: ${{ runner.temp }}/windows-zinc/
  windows-console:
    # ZN-714: the programs of windows-cross run on Windows and print their frozen outputs (one PASS or FAIL line each)
    name: windows-console
    needs: windows-cross
    if: vars.ZINC_WINDOWS_JOBS == 'true'
    runs-on: windows-latest
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-console
          path: windows-console
      - name: Run the console programs
        run: tools/windows-cross check "$PWD/windows-console"
      - uses: actions/download-artifact@v4
        with:
          name: windows-zinc
          path: windows-zinc
      - name: zinc.exe starts, the platform layer works
        run: |
          windows-zinc/platform_test.exe
          windows-zinc/zinc.exe --version
          printf 'console.log(6 * 7);\n' > answer.ts
          [ "$(ZINC_ROOT="$PWD" windows-zinc/zinc.exe run answer.ts | tr -d '\r')" = 42 ]
  linux-cross:
    # zinc for Linux cross-built with the pinned zig (tools/build-linux, docs/targets/linux.md), one job per architecture, then started under
    # qemu-user against Ubuntu's cross C libraries (glibc 2.39: the 2.28 floor is proven in Debian 10 containers, not here). Off unless the
    # repository variable ZINC_LINUX_JOBS is 'true' (macOS only for now, owner 2026-10-15); never run yet, so it does not block.
    name: linux-cross (${{ matrix.arch }})
    needs: plan
    if: vars.ZINC_LINUX_JOBS == 'true'
    runs-on: ubuntu-24.04
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: aarch64, run: 'qemu-aarch64 -L /usr/aarch64-linux-gnu', libc: libc6-arm64-cross }
          - { arch: armhf, run: 'qemu-arm -L /usr/arm-linux-gnueabihf', libc: libc6-armhf-cross }
          - { arch: x86_64, run: '', libc: '' }
          - { arch: i686, run: '', libc: libc6-i386 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake python3 curl xz-utils zstd file qemu-user ${{ matrix.libc }}
      - name: The pinned zig (the pin of src/tc/tc.cpp)
        run: |
          ZINC_HOME=$RUNNER_TEMP/zinc-home; echo "ZINC_HOME=$ZINC_HOME" >> "$GITHUB_ENV"
          pin=$(grep -o '"x86_64-linux", "zig-x86_64-linux-[^"]*", "[0-9a-f]*"' src/tc/tc.cpp | head -1 | tr -d '"' | tr ',' ' ')
          read -r _ file sha <<< "$pin"; version=${file#zig-x86_64-linux-}; version=${version%.tar.xz}
          curl -fL --retry 2 -sS -o "$RUNNER_TEMP/$file" "https://ziglang.org/download/$version/$file"
          echo "$sha  $RUNNER_TEMP/$file" | sha256sum -c -
          mkdir -p "$ZINC_HOME/toolchains/zig-x86_64-linux-$version"
          tar -xJf "$RUNNER_TEMP/$file" -C "$ZINC_HOME/toolchains/zig-x86_64-linux-$version" --strip-components=1
      - name: Cross build zinc and its archive
        run: tools/build-linux --arch ${{ matrix.arch }}
      - name: zinc starts, runs a program, checks it
        run: |
          printf 'console.log(6 * 7);\n' > "$RUNNER_TEMP/answer.ts"
          z="${{ matrix.run }} build-linux-${{ matrix.arch }}/zinc"
          $z --version
          [ "$(ZINC_ROOT="$PWD" $z run --interp "$RUNNER_TEMP/answer.ts" 2>/dev/null)" = 42 ]
          ZINC_ROOT="$PWD" $z check "$RUNNER_TEMP/answer.ts"
          tar -tzf dist/linux-${{ matrix.arch }}/zinc-*.tar.gz | grep '/bin/zinc-atelier$' >/dev/null   # the Atelier's launcher, for install.sh --atelier
      - name: Update manifests (release)
        # zinc-linux-<arch>.manifest and its beta, as the macOS and Windows jobs write them (signed with ZINC_UPDATE_SEED, by the zinc just built)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ZINC_UPDATE_SEED: ${{ secrets.ZINC_UPDATE_SEED }}
        run: |
          d=dist/linux-${{ matrix.arch }}
          for pkg in "$d"/zinc-*-linux-*.tar.gz; do break; done
          v=${GITHUB_REF_NAME#v} file=$(basename "$pkg") sum=$(sha256sum "$pkg" | cut -d' ' -f1)
          manifest() {   # manifest <channel> <url> <out>
            printf 'channel=%s\nversion=%s\nurl=%s\nsha256=%s\nnotes=%s\n' "$1" "$v" "$2" "$sum" "Zinc $GITHUB_REF_NAME" > "$RUNNER_TEMP/m"
            if [ -n "$ZINC_UPDATE_SEED" ]; then ${{ matrix.run }} build-linux-${{ matrix.arch }}/zinc update-sign "$RUNNER_TEMP/m" "$ZINC_UPDATE_SEED" > "$3"
            else { echo "signature=none"; cat "$RUNNER_TEMP/m"; } > "$3"; fi
          }
          [ -n "$ZINC_UPDATE_SEED" ] || echo "::warning::no ZINC_UPDATE_SEED: the update manifests of linux-${{ matrix.arch }} are unsigned (signature=none)"
          case "$v" in
            *-*) manifest beta "${GITHUB_SERVER_URL:-https://github.com}/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$file" "$d/zinc-linux-${{ matrix.arch }}-beta.manifest" ;;
            *) manifest stable "$file" "$d/zinc-linux-${{ matrix.arch }}.manifest"; manifest beta "$file" "$d/zinc-linux-${{ matrix.arch }}-beta.manifest" ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/linux-${{ matrix.arch }}/*.tar.gz
            dist/linux-${{ matrix.arch }}/*.manifest
  release:
    # ZN-329: on a v* tag, the downloads of every OS job (the zinc CLI archive, the Zinc Atelier app on macOS; signed for macOS when the secrets exist)
    # and their update manifests on a GitHub Release
    name: release
    needs: [package, package-windows, linux-cross, test]   # the test shards too: the CI runs only on a release (owner, 2026-10-19), so a FAIL keeps it from being published
    if: ${{ !cancelled() && needs.package.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}   # the Windows package is experimental: released when it built
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # the plugins' split commits need the history
      - uses: actions/download-artifact@v4
        with:
          pattern: test-results-*
          path: test-results
      - name: Every test passed
        # the shards never fail their job (continue-on-error): their results files say it. No result, or one FAIL, and nothing is published
        run: |
          cat test-results/*/results-*.txt > all-results.txt 2>/dev/null || true
          [ -s all-results.txt ] || { echo "::error::no test results: the release waits for the tests"; exit 1; }
          if grep '^FAIL' all-results.txt; then echo "::error::tests failed: nothing is released (fix them on develop, make release-undo, release again)"; exit 1; fi
          echo "$(grep -c '^PASS' all-results.txt) passed, $(grep -c '^SKIP' all-results.txt) skipped"
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        # the Linux CLI archives of linux-cross (zinc-<version>-linux-<arch>.tar.gz); experimental: released when they built
        with:
          pattern: linux-*
          path: release
          merge-multiple: true
      - name: plugins.lock (ZN-335)
        run: tools/plugin-split --lock release/plugins.lock
      - name: Installer and checksums
        # ZN-718: install.sh reads SHA256SUMS beside it (curl -fsSL .../releases/latest/download/install.sh | sh), so both are release assets
        run: |
          cp tools/install.sh release/
          cp tools/install.ps1 release/   # Windows: irm .../install.ps1 | iex
          cd release
          # one line per download: the CLI archives (zinc-<version>-<os>-<arch>.tar.gz, .zip on Windows) and the apps (Zinc-Atelier-<version>-macos-<arch>.zip)
          for f in zinc-*.tar.gz zinc-*.zip Zinc-Atelier-*.zip; do if [ -f "$f" ]; then shasum -a 256 "$f"; fi; done > SHA256SUMS
          grep -q ' zinc-' SHA256SUMS || { echo "::error::no CLI archive to release"; exit 1; }
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la release
          nl=$'\n'
          # the changelog `make release` wrote as the tag message (its first line is the title)
          changelog=$(git for-each-ref "refs/tags/$GITHUB_REF_NAME" --format='%(contents)' | sed '1{/^Zinc /d;}' | sed '1{/^$/d;}')
          notes="Zinc ${GITHUB_REF_NAME}${nl}${nl}${changelog:+$changelog$nl$nl}## Downloads${nl}${nl}Install the zinc CLI: \`curl -fsSL https://github.com/${GH_REPO}/releases/latest/download/install.sh | sh\` (add \`-s -- --atelier\` for the app too).${nl}${nl}"
          notes="$notes- \`zinc-<version>-macos-<arch>.tar.gz\`: the zinc CLI (bin/zinc, the standard library, templates, plugins with their native libraries); unpack anywhere and link bin/zinc onto your PATH.${nl}"
          notes="$notes- \`Zinc-Atelier-<version>-macos-<arch>.zip\`: the Zinc Atelier app, the engine inside; unzip and drag it to Applications.${nl}"
          if ls release/zinc-*-linux-*.tar.gz >/dev/null 2>&1; then notes="$notes- \`zinc-<version>-linux-<arch>.tar.gz\`: the zinc CLI for Linux (x86_64, aarch64, armhf, i686; glibc 2.28 or later), the same layout as macOS; \`install.sh\` picks it. With \`install.sh --atelier\`, Zinc Atelier goes into the applications menu.${nl}"; fi
          if ls release/Zinc-Atelier-*-windows-*.zip >/dev/null 2>&1; then notes="$notes- \`Zinc-Atelier-<version>-windows-x86_64.zip\`: the Zinc Atelier app for Windows, the engine inside; unzip it and open \"Zinc Atelier.exe\" in the folder.${nl}"; fi
          if ls release/zinc-*-windows-*.zip >/dev/null 2>&1; then notes="$notes- \`zinc-<version>-windows-x86_64.zip\`: the zinc CLI for Windows 10/11 (bin\\zinc.exe, the standard library, templates); install it with \`irm https://github.com/${GH_REPO}/releases/latest/download/install.ps1 | iex\` in PowerShell. Not signed yet: SmartScreen may ask you to confirm.${nl}"; fi
          notes="$notes- \`install.sh\`, \`SHA256SUMS\`: the installer and the checksums it checks; \`zinc-<os>-<arch>[-beta].manifest\`: what \`zinc update\` reads (stable and beta channels); \`plugins.lock\`: the plugin mirrors.${nl}"
          if [ ! -f release/.signed ]; then notes="$notes${nl}The macOS downloads are not signed or notarized (no signing secrets): right-click > Open on the app the first time."; echo "::warning::releasing unsigned macOS downloads"; fi
          if grep -L '^sig=' release/*.manifest 2>/dev/null | grep -q .; then notes="$notes${nl}The update manifests are unsigned (no ZINC_UPDATE_SEED secret): zinc update refuses them unless ZINC_UPDATE_ALLOW_UNSIGNED=1."; echo "::warning::unsigned update manifests"; fi
          files=(release/zinc-* release/install.sh release/SHA256SUMS)
          [ ! -f release/install.ps1 ] || files+=(release/install.ps1)   # the CLI archives and the manifests, not the size reports
          for f in release/Zinc-Atelier-* release/plugins.lock; do if [ -f "$f" ]; then files+=("$f"); fi; done
          pre=(); case "$GITHUB_REF_NAME" in *-*) pre=(--prerelease) ;; esac   # v1.3.0-beta.1: not the latest release, the beta channel only
          gh release create "$GITHUB_REF_NAME" --title "Zinc ${GITHUB_REF_NAME}" --notes "$notes" "${pre[@]}" "${files[@]}"
          if [ ${#pre[@]} -gt 0 ]; then   # the beta manifests go on the latest release, where zinc update --channel beta reads them
            latest=$(gh release view --json tagName -q .tagName) && gh release upload "$latest" release/*-beta.manifest --clobber
          fi
      - name: Homebrew tap
        # brew install frulko/zinc/zinc: the formula of this release (tools/homebrew-formula) pushed to <owner>/homebrew-zinc with its deploy key; stable tags only
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          HOMEBREW_TAP_KEY: ${{ secrets.HOMEBREW_TAP_KEY }}
        run: |
          [ -n "$HOMEBREW_TAP_KEY" ] || { echo "::warning::no HOMEBREW_TAP_KEY secret: the Homebrew formula stays at the previous version"; exit 0; }
          printf '%s\n' "$HOMEBREW_TAP_KEY" > "$RUNNER_TEMP/tap_key" && chmod 600 "$RUNNER_TEMP/tap_key"
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/tap_key -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 "git@github.com:${GITHUB_REPOSITORY_OWNER}/homebrew-zinc.git" "$RUNNER_TEMP/tap"
          mkdir -p "$RUNNER_TEMP/tap/Formula"
          tools/homebrew-formula "${GITHUB_REF_NAME#v}" release/SHA256SUMS "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/tap/Formula/zinc.rb"
          cd "$RUNNER_TEMP/tap"
          git add Formula/zinc.rb
          git diff --cached --quiet && exit 0
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -m "zinc ${GITHUB_REF_NAME#v}"
          git push
  plugin-mirrors:
    # ZN-335, D37: each plugins/<name> changed since the previous release is split (git subtree, history kept) and pushed to zinc-engine/plugin-<name>,
    # once the release is published
    name: plugin-mirrors
    needs: release
    if: needs.release.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Split and push the changed plugins
        env:
          PLUGIN_MIRROR_TOKEN: ${{ secrets.PLUGIN_MIRROR_TOKEN }}
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_SHA^" 2>/dev/null) || prev=$(git hash-object -t tree /dev/null)   # the first release: every plugin
          changed=$(git diff --name-only "$prev" "$GITHUB_SHA" -- plugins/ 2>/dev/null | cut -d/ -f2 | sort -u)
          [ -n "$changed" ] || { echo "no plugin changed"; exit 0; }
          if [ -z "$PLUGIN_MIRROR_TOKEN" ]; then
            echo "::notice::no PLUGIN_MIRROR_TOKEN: splitting without pushing ($(echo "$changed" | tr '\n' ' '))"
            for n in $changed; do [ -f "plugins/$n/plugin.json" ] && tools/plugin-split "$n"; done
            exit 0
          fi
          for n in $changed; do
            [ -f "plugins/$n/plugin.json" ] || continue
            ZINC_PLUGIN_REPO_BASE="https://x-access-token:${PLUGIN_MIRROR_TOKEN}@github.com/zinc-engine" tools/plugin-split --push "$n"
          done
  pages:
    # the site (site/, docs/) with the release, from this same pipeline
    needs: release
    if: needs.release.result == 'success'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
  reproducible:
    # ZN-333: zinc and three plugins built twice, from two directories, are byte-identical (docs/reports/zinc-next-reproducible.md)
    name: reproducible
    needs: plan
    if: needs.plan.outputs.reproducible == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with: { path: one }
      - uses: actions/checkout@v4
        with: { path: second/copy }
      - run: brew install cmake || true
      - name: Build twice
        run: |
          for d in one second/copy; do
            cmake -S "$d" -B "$d/build" -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3 -DZN_REPRODUCIBLE=ON && cmake --build "$d/build" -j4 --target zinc
            sleep 2
          done
      - name: Compare zinc and libzn_webgl
        run: cmp one/build/zinc second/copy/build/zinc && cmp one/build/libzn_webgl.dylib second/copy/build/libzn_webgl.dylib
      - name: Compare plugin archives
        run: |
          ZINC_ZIG="$(ZINC_ROOT="$PWD/one" one/build/zinc toolchain path | tail -1)"
          export ZINC_ZIG
          for d in one second/copy; do
            for p in device sqlite svg; do
              ZINC_ROOT="$PWD/$d" ZINC_HOME="$RUNNER_TEMP/home-${d%%/*}" "$d/build/zinc" plugin-build "$p" "$d" --pack "$RUNNER_TEMP/$p-${d%%/*}.tar"
            done
          done
          for p in device sqlite svg; do cmp "$RUNNER_TEMP/$p-one.tar" "$RUNNER_TEMP/$p-second.tar"; done
  bench-gate:
    # ZN-148: compare the candidate and pinned reference on the same runner; preserve the 15% limit.
    name: bench-gate
    needs: plan
    if: needs.plan.outputs.bench == 'true'
    runs-on: macos-15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: brew install cmake
      - name: Build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3 && cmake --build build --target zinc -j3
      - name: Build the measured reference revision
        run: |
          reference="$RUNNER_TEMP/zinc-benchmark-reference"
          git worktree add --detach "$reference" fb610f986e50a0533301cbcc16b5addefb56089f
          # Reconstruct headers omitted from the original measured checkout; leave engine sources unchanged.
          git -C "$reference" restore --source=dc4d08f4fef006c9858057ef54b7825308f1c7c3 --worktree -- next/third_party/SDL3/include/build_config
          git -C "$reference" restore --source=f1b0f48f675d8921879ac5859979033d08a4e5c3 --worktree -- runtime/include/hal.h
          src="$reference"; [ -f "$reference/next/CMakeLists.txt" ] && src="$reference/next"   # a revision from before the engine moved to the root
          cmake -S "$src" -B "$reference/build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$reference/build" --target zinc -j3
          echo "ZINC_BENCH_BASELINE=$reference/build/zinc" >> "$GITHUB_ENV"
      - name: Gate
        run: tools/bench-gate
      - name: Upload benchmark measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-measurements
          path: /tmp/zn-bench-gate.*
