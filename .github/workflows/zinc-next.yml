# Zinc Next: affected T0/T1 on every host; full T2 on nightly/manual/release runs.
# Windows is listed so the day the host is ported (ZN-054) it starts running; until then its job may fail and does not block.
# A `v*` tag also makes a release (ZN-329): each OS job signs its package when the signing secrets exist and writes a signed update manifest,
# then the release job attaches everything to a GitHub Release. The secrets and the tag command: docs/guide/07-distribution.md, "Releases".
name: zinc-next
on:
  push:
    branches: ['**']
    tags: ['v*']   # path filters are not applied to tags
    paths: ['next/**', 'lib/**', 'runtime/**', 'targets/**', 'plugins/**', 'compiler/**', 'examples/**', 'tests/**', 'package.json', 'pnpm-lock.yaml', '.github/workflows/zinc-next.yml']
  pull_request:
    paths: ['next/**', 'lib/**', 'runtime/**', 'targets/**', 'plugins/**', 'compiler/**', 'examples/**', 'tests/**', 'package.json', 'pnpm-lock.yaml', '.github/workflows/zinc-next.yml']
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.event_name || 'code' }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      test: ${{ steps.scope.outputs.test }}
      full: ${{ steps.scope.outputs.full }}
      bench: ${{ steps.scope.outputs.bench }}
      reproducible: ${{ steps.scope.outputs.reproducible }}
      package: ${{ steps.scope.outputs.package }}
      base: ${{ steps.scope.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: scope
        name: Select checks
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          full=
          if [[ "$EVENT" == schedule || "$EVENT" == workflow_dispatch || "$GITHUB_REF" == refs/tags/v* ]]; then full=--full; fi
          base="$BEFORE"
          if [ "$EVENT" = pull_request ]; then base="$PR_BASE"; fi
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base=$(git merge-base "origin/$DEFAULT_BRANCH" HEAD 2>/dev/null) || base=$(git hash-object -w -t tree /dev/null)
          fi
          git diff --name-only "$base" HEAD -- > "$RUNNER_TEMP/changed-paths"
          python3 next/tools/ci-plan ${full:+"$full"} < "$RUNNER_TEMP/changed-paths" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
  test:
    needs: plan
    if: needs.plan.outputs.test == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, name: linux-x86_64, tier: t2 }
          - { os: ubuntu-24.04-arm, name: linux-aarch64, tier: t2 }
          - { os: macos-14, name: macos-arm64, tier: t2 }
          - { os: windows-latest, name: windows-x86_64, tier: t1, experimental: true }
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    defaults:
      run:
        working-directory: next
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: '10' }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: 'pnpm' }
      - name: Install compiler dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: Dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake python3 curl xz-utils libx11-dev libxext-dev libxcursor-dev libxi-dev libxfixes-dev libxrandr-dev libxss-dev libxtst-dev libgl1-mesa-dev libpixman-1-0 libsdl2-2.0-0 libslirp0  # the last three: Espressif's QEMU
      - name: Dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake sdl3 coreutils quickjs pixman libgcrypt sdl2
      - name: Build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j4
      - name: Cache pinned toolchains
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            ~/.zinc/toolchains
            ${{ runner.temp }}/zinc-home/toolchains
          key: toolchains-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('next/src/tc/tc.cpp', 'next/src/tc/tc.h') }}
      - name: Tests
        env:
          ZINC_TEST_HOME: ${{ runner.temp }}/zinc-home
          FULL: ${{ needs.plan.outputs.full }}
          BASE: ${{ needs.plan.outputs.base }}
        run: |
          if [ "$FULL" = true ]; then
            tests/run --tier ${{ matrix.tier }}
          else
            tests/run --changed-from "$BASE" --tier ${{ matrix.tier }}
          fi
      - name: Pixel canary for visible changes
        if: needs.plan.outputs.full != 'true' && runner.os != 'Windows'
        env:
          BASE: ${{ needs.plan.outputs.base }}
        run: |
          git diff --name-only "$BASE" HEAD -- | python3 tests/affected.py tests/affected.json > "$RUNNER_TEMP/affected-tests"
          if grep -qx canary "$RUNNER_TEMP/affected-tests"; then tools/proto-capture compare --canary --zinc build/zinc; fi
      - name: Upload failed test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.name }}
          path: next/.logs/
          include-hidden-files: true
      - name: Package (macOS and Linux)
        if: runner.os != 'Windows' && needs.plan.outputs.package == 'true'
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then export ZINC_VERSION="${GITHUB_REF_NAME#v}"; fi   # v1.2.0 -> Zinc-1.2.0-...
          tools/package --out dist
      - name: Sign and notarize (macOS release)
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          ZINC_SIGN_IDENTITY: ${{ secrets.ZINC_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE_P12" ] || [ -z "$ZINC_SIGN_IDENTITY" ] || [ -z "$APPLE_ID" ]; then
            echo "::warning::no signing secrets: the macOS package is released unsigned and not notarized"
            exit 0
          fi
          kc="$RUNNER_TEMP/zinc.keychain-db"; pw=$(openssl rand -hex 16)
          security create-keychain -p "$pw" "$kc" && security set-keychain-settings -lut 3600 "$kc" && security unlock-keychain -p "$pw" "$kc"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign && rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" login.keychain-db
          xcrun notarytool store-credentials zinc-notary --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --keychain "$kc"
          for z in dist/Zinc-*-macos-*.zip; do
            ZINC_NOTARY_PROFILE=zinc-notary tools/sign-macos "$z" && mv "${z%.zip}-notarized.zip" "$z"
          done
          echo signed > dist/.signed
      - name: Update manifest (release)
        if: runner.os != 'Windows' && startsWith(github.ref, 'refs/tags/v')
        env:
          ZINC_UPDATE_SEED: ${{ secrets.ZINC_UPDATE_SEED }}
        run: |
          if [ -z "$ZINC_UPDATE_SEED" ]; then echo "::warning::no ZINC_UPDATE_SEED: no update manifest for ${{ matrix.name }}"; exit 0; fi
          for pkg in dist/*.zip dist/*.tar.gz; do [ -f "$pkg" ] && break; done
          printf 'version=%s\nurl=%s\nsha256=%s\nnotes=%s\n' "${GITHUB_REF_NAME#v}" "$(basename "$pkg")" "$(shasum -a 256 "$pkg" | cut -d' ' -f1)" "Zinc ${GITHUB_REF_NAME}" > "$RUNNER_TEMP/m"
          build/zinc update-sign "$RUNNER_TEMP/m" "$ZINC_UPDATE_SEED" > "dist/zinc-${{ matrix.name }}.manifest"
      - uses: actions/upload-artifact@v4
        if: runner.os != 'Windows' && needs.plan.outputs.package == 'true'
        with:
          name: package-${{ matrix.name }}
          path: next/dist/
          include-hidden-files: true   # dist/.signed: the macOS package was signed and notarized
  release:
    # ZN-329: on a v* tag, the packages of every OS job (signed for macOS when the secrets exist) and their update manifests on a GitHub Release
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # the plugins' split commits need the history
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: release
          merge-multiple: true
      - name: plugins.lock (ZN-335)
        run: next/tools/plugin-split --lock release/plugins.lock
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la release
          notes="Zinc ${GITHUB_REF_NAME}."
          if [ ! -f release/.signed ]; then notes="$notes The macOS package is not signed or notarized (no signing secrets): right-click > Open the first time."; echo "::warning::releasing an unsigned macOS package"; fi
          ls release/*.manifest >/dev/null 2>&1 || notes="$notes No update manifests (no ZINC_UPDATE_SEED secret)."
          gh release create "$GITHUB_REF_NAME" --title "Zinc ${GITHUB_REF_NAME}" --notes "$notes" release/*
  plugin-mirrors:
    # ZN-335, D37: each plugins/<name> changed on main is split (git subtree, history kept) and pushed to zinc-engine/plugin-<name>
    name: plugin-mirrors
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Split and push the changed plugins
        env:
          PLUGIN_MIRROR_TOKEN: ${{ secrets.PLUGIN_MIRROR_TOKEN }}
          BEFORE: ${{ github.event.before }}
        run: |
          changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- plugins/ 2>/dev/null | cut -d/ -f2 | sort -u)
          [ -n "$changed" ] || { echo "no plugin changed"; exit 0; }
          if [ -z "$PLUGIN_MIRROR_TOKEN" ]; then
            echo "::notice::no PLUGIN_MIRROR_TOKEN: splitting without pushing ($(echo "$changed" | tr '\n' ' '))"
            for n in $changed; do [ -f "plugins/$n/plugin.json" ] && next/tools/plugin-split "$n"; done
            exit 0
          fi
          for n in $changed; do
            [ -f "plugins/$n/plugin.json" ] || continue
            ZINC_PLUGIN_REPO_BASE="https://x-access-token:${PLUGIN_MIRROR_TOKEN}@github.com/zinc-engine" next/tools/plugin-split --push "$n"
          done
  reproducible:
    # ZN-333: zinc and three plugins built twice, from two directories, are byte-identical (docs/reports/zinc-next-reproducible.md)
    name: reproducible
    needs: plan
    if: needs.plan.outputs.reproducible == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with: { path: one }
      - uses: actions/checkout@v4
        with: { path: second/copy }
      - run: brew install cmake || true
      - name: Build twice
        run: |
          for d in one second/copy; do
            cmake -S "$d/next" -B "$d/next/build" -DCMAKE_BUILD_TYPE=Release -DZN_REPRODUCIBLE=ON && cmake --build "$d/next/build" -j4 --target zinc
            sleep 2
          done
      - name: Compare zinc and libzn_webgl
        run: cmp one/next/build/zinc second/copy/next/build/zinc && cmp one/next/build/libzn_webgl.dylib second/copy/next/build/libzn_webgl.dylib
      - name: Compare plugin archives
        run: |
          ZINC_ZIG="$(ZINC_ROOT="$PWD/one/next" one/next/build/zinc toolchain path | tail -1)"
          export ZINC_ZIG
          for d in one second/copy; do
            for p in device sqlite svg; do
              ZINC_ROOT="$PWD/$d/next" ZINC_HOME="$RUNNER_TEMP/home-${d%%/*}" "$d/next/build/zinc" plugin-build "$p" "$d" --pack "$RUNNER_TEMP/$p-${d%%/*}.tar"
            done
          done
          for p in device sqlite svg; do cmp "$RUNNER_TEMP/$p-one.tar" "$RUNNER_TEMP/$p-second.tar"; done
  bench-gate:
    # ZN-148: compare the candidate and pinned reference on the same runner; preserve the 15% limit.
    name: bench-gate
    needs: plan
    if: needs.plan.outputs.bench == 'true'
    runs-on: macos-14
    defaults:
      run:
        working-directory: next
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: brew install cmake
      - name: Build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target zinc -j3
      - name: Build the measured reference revision
        run: |
          reference="$RUNNER_TEMP/zinc-benchmark-reference"
          git worktree add --detach "$reference" fb610f986e50a0533301cbcc16b5addefb56089f
          # Reconstruct headers omitted from the original measured checkout; leave engine sources unchanged.
          git -C "$reference" restore --source=dc4d08f4fef006c9858057ef54b7825308f1c7c3 --worktree -- next/third_party/SDL3/include/build_config
          git -C "$reference" restore --source=f1b0f48f675d8921879ac5859979033d08a4e5c3 --worktree -- runtime/include/hal.h
          cmake -S "$reference/next" -B "$reference/next/build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$reference/next/build" --target zinc -j3
          echo "ZINC_BENCH_BASELINE=$reference/next/build/zinc" >> "$GITHUB_ENV"
      - name: Gate
        run: tools/bench-gate
      - name: Upload benchmark measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-measurements
          path: /tmp/zn-bench-gate.*
