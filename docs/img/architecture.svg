<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 648" width="1000" height="648" role="img" aria-labelledby="zn-arch-title zn-arch-desc">
<title id="zn-arch-title">Zinc architecture, in layers</title>
<desc id="zn-arch-desc">Layer stack: a program and the standard library sit on a compiler (frontend, typed IR, ZBC bytecode), then three engines (interpreter, AOT to C++, QuickJS) over one shared runtime, then the host and one HAL per target. Plugins attach to the library and the host; the zinc CLI and toolchain wrap the whole stack.</desc>
