# Maintained by Zinc. tty1 is the session's (zinc-shell.service): no login prompt there. A condition rather than a mask:
# Raspberry Pi OS's user rename (userconf-pi, which cloud-init runs for the profile's or Imager's user) enables and starts
# getty@tty1, and fails on a masked unit, which stops cloud-init before the user's SSH keys.
[Unit]
ConditionPathExists=!/usr/lib/zinc/zinc-session
