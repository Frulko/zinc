# A cable straight to a computer (Sidecar Screen, zinc device): no DHCP server answers, so after 8 s the wired port takes a link-local
# address (169.254.x.x), as macOS and Windows do, and <hostname>.local finds it. 4 = fallback: only when DHCP gave nothing (NM 1.52+).
[connection-ethernet]
match-device=type:ethernet
ipv4.link-local=4
ipv4.dhcp-timeout=8
